name: Project map sync

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check project map covers active repositories
        run: bash scripts/check-project-map.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

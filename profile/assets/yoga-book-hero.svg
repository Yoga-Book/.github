<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Yoga Book Linux</title>
  <desc id="description">A dark blue banner with the Yoga Book Linux name and a line illustration of a convertible tablet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1a"/>
      <stop offset="0.55" stop-color="#111d38"/>
      <stop offset="1" stop-color="#172c48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52d3ff"/>
      <stop offset="1" stop-color="#8b9dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#42c8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#42c8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d7ff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1010" cy="175" rx="330" ry="265" fill="url(#glow)"/>
  <path d="M0 310C260 252 443 348 681 305s394-61 599-21v76H0z" fill="#07101f" fill-opacity="0.55"/>

  <g transform="translate(82 81)">

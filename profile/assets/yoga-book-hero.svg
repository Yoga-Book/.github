    <path d="M15 16h7.5v22H15zm12 0h7.5v22H27zm12 0h7.5v22H39z" fill="#08101f"/>
    <path d="M11 42h39" stroke="#08101f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g fill="#f7fbff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="82" y="190" font-size="58" font-weight="720" letter-spacing="-1.5">Yoga Book Linux</text>
    <text x="85" y="232" fill="#b9c8dd" font-size="21" font-weight="450">Hardware enablement for the original Intel-based Yoga Book</text>
  </g>

